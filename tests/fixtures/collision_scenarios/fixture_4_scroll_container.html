<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixture 4: Legitimate Horizontal Scroll Container</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    .panel {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      max-width: 600px; /* Constrained container */
    }
    .table-container {
      overflow-x: auto;
      max-width: 100%;
      border: 1px solid #334155;
    }
    table {
      width: 900px; /* Wide table inside container */
      border-collapse: collapse;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #334155;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h3>Active Subscriptions Ledger</h3>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Service Name</th>
            <th>Category</th>
            <th>Billing Cycle</th>
            <th>Renewal Date</th>
            <th>Monthly Eq</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Google Workspace Enterprise</td>
            <td>Communication</td>
            <td>Monthly</td>
            <td>2026-11-01</td>
            <td>$300.00</td>
            <td><button>Edit</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
