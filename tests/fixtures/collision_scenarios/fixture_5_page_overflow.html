<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixture 5: Accidental Page-Level Horizontal Overflow</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 0; }
    /* Unintended blowout: child element has fixed 1200px width inside a 600px viewport */
    .unconstrained-banner {
      width: 1200px;
      background: #dc2626;
      padding: 24px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="unconstrained-banner">
    <h1>Blowout Banner (1200px Wide)</h1>
    <p>This element forces the root document to scroll horizontally on viewports under 1200px.</p>
  </div>
</body>
</html>
