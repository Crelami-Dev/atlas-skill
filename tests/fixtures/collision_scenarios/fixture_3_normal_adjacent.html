<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixture 3: Normal Adjacent Elements</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    .grid-row {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      width: 500px;
    }
    .service-avatar {
      width: 36px;
      height: 36px;
      background: #38bdf8;
      border-radius: 6px;
    }
    .service-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .service-name {
      font-weight: 600;
      color: #f8fafc;
    }
    .badge-category {
      background: #334155;
      padding: 4px 8px;
      border-radius: 4px;
      color: #94a3b8;
      font-size: 12px;
      align-self: flex-start;
    }
    .service-price {
      font-weight: 700;
      color: #10b981;
    }
  </style>
</head>
<body>
  <div class="grid-row">
    <div class="service-avatar"></div>
    <div class="service-info">
      <span class="service-name">AWS Cloud Infrastructure</span>
      <span class="badge-category">Infrastructure</span>
    </div>
    <span class="service-price">$450.00/mo</span>
  </div>
</body>
</html>
