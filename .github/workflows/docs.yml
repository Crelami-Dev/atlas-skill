name: Deploy Documentation Site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'references/**'
      - 'templates/**'
      - 'scripts/**'
      - 'skills/**'
      - 'suites/**'
      - 'evals/**'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate documentation from repo sources
        run: node scripts/gen-docs.mjs

      - name: Verify documentation sync and honesty checks
        run: node scripts/check-docs.mjs

      - name: Install documentation site dependencies
        working-directory: site
        run: npm ci

      - name: Build Astro Starlight site
        working-directory: site
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
